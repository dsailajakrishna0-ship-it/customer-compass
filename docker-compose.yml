services:
  db:
    image: postgres:17-alpine
    container_name: customer-compass-db
    environment:
      POSTGRES_DB: customer_compass
      POSTGRES_USER: customer_compass
      POSTGRES_PASSWORD: customer_compass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_compass -d customer_compass"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: customer-compass-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:
