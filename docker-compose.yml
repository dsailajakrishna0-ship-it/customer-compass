services:
  db:
    image: pgvector/pgvector:pg17
    container_name: customer-compass-db
    environment:
      POSTGRES_DB: customer_compass
      POSTGRES_USER: customer_compass
      POSTGRES_PASSWORD: customer_compass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db/002-rag.sql:/docker-entrypoint-initdb.d/002-rag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_compass -d customer_compass"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: customer-compass-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama

  # --- Alternative vector store (Qdrant) ---------------------------------
  # Default vector storage is `pgvector` on the `db` service above (Stage 3).
  # To try Qdrant as a swappable alternative instead (see docs/tech-stack.md):
  #   1. Uncomment the `qdrant` service below.
  #   2. Run `docker-compose up -d qdrant`.
  #   3. Set `VECTOR_STORE=qdrant` when starting the API (`npm run dev`).
  #   4. Comment it back out (and unset the env var) to return to pgvector —
  #      no other changes needed, both stores can coexist since RAG data is
  #      always re-ingested via `POST /api/documents/ingest`.
  #
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: customer-compass-qdrant
  #   ports:
  #     - "6333:6333"   # REST API
  #     - "6334:6334"   # gRPC API
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  # -------------------------------------------------------------------------

volumes:
  postgres-data:
  ollama-data:
  # qdrant-data:   # uncomment along with the `qdrant` service above
